[package]
name = "oqci-python"
description = "Python bindings for the Open Quantum Compiler Infrastructure"
version = "0.3.0"
edition = "2024"

license = "Apache-2.0"
repository = "https://github.com/AndyFerns/oqci"

[lib]
name = "oqci_native"
crate-type = ["cdylib"]

[dependencies]
oqci = { path = ".." }
pyo3 = { version = "0.24", features = ["extension-module"] }
# The compiler already speaks JSON; reusing that schema for the Python view
# keeps it identical to the CLI's `--json` output by construction.
serde_json = "1"
