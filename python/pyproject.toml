[build-system]
requires = ["maturin>=1.7,<2.0"]
build-backend = "maturin"

[project]
name = "oqci"
description = "Python bindings for the Open Quantum Compiler Infrastructure"
requires-python = ">=3.9"
license = { text = "Apache-2.0" }
classifiers = [
    "Programming Language :: Rust",
    "Programming Language :: Python :: Implementation :: CPython",
]
dynamic = ["version"]

[project.optional-dependencies]
qiskit = ["qiskit>=1.0"]
aer = ["qiskit>=1.0", "qiskit-aer>=0.14"]
# Pinned to the minor release `oqci.backends.ibm` was verified against
# (docs/adapters.md, §33.4). Raising it means re-checking that module.
ibm = ["qiskit>=2.0,<3.0", "qiskit-ibm-runtime>=0.50.0,<0.51"]
# The release the `cudaq` CI job runs oqci.backends.cudaq against
# (python/tests/test_backend_cudaq_live.py; docs/adapters.md).
cudaq = ["cudaq==0.16.0.post1"]

[tool.maturin]
module-name = "oqci._native"
manifest-path = "Cargo.toml"
# A mixed layout: the pure-Python `oqci` package sits alongside the compiled
# `oqci_native` extension. Spec 17 asks the SDK for circuit import, compiler
# invocation, configuration, backend selection, analysis and result access,
# which is more than an extension module of loose functions should carry.
python-source = "."
