[package]
name = "oqci"
description = "The Open Quantum Compiler Infrastructure"
version = "0.3.0"
readme = "README.md"
edition = "2024"

license = "Apache-2.0"
repository = "https://github.com/AndyFerns/oqci"

[workspace]
members = [".", "python"]

[lib]
name = "oqci"
path = "src/lib.rs"

[[bin]]
name = "oqci"
path = "src/main.rs"

[dependencies]
thiserror = "2"
petgraph = "0.6"
clap = { version = "4", features = ["derive"] }
notify = "6"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
proptest = "1"
num-complex = "0.4"
