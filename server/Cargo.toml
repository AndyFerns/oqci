[package]
name = "oqci-server"
description = "Local live-visualization server for OQCI — a read-only observer of the compiler"
version = "0.1.0"
edition = "2024"

license = "Apache-2.0"
repository = "https://github.com/AndyFerns/oqci"

[[bin]]
name = "oqci-server"
path = "src/main.rs"

[dependencies]
oqci = { path = ".." }
axum = { version = "0.7", features = ["ws"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "fs", "signal", "time"] }
futures-util = "0.3"
tower-http = { version = "0.5", features = ["fs", "cors", "trace"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
notify = "6"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
clap = { version = "4", features = ["derive"] }
anyhow = "1"
