name: CI

# The project's core quality gates (final-deliverables-spec.md §26): build,
# tests, formatting, lints and rustdoc on every push and pull request, on the
# platforms the determinism contract is claimed for. Hardware jobs never run
# here (§26: not without credentials and an explicit resource policy).

on:
  push:
    branches: [master, main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    name: rust (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # build.rs records the git commit in provenance; a full clone keeps
          # that value real rather than "unknown".
          fetch-depth: 0

      # rust-toolchain.toml pins the compiler and components; rustup reads it
      # on the first cargo invocation.
      - name: Show toolchain
        run: rustup show

      - name: Cache
        uses: Swatinem/rust-cache@v2

      - name: Format
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      # oqci-python is a PyO3 extension module: it links against the Python
      # interpreter only when loaded, so its tests run in the python job.
      - name: Test
        run: cargo test --workspace --exclude oqci-python

      - name: Rustdoc
        run: cargo doc --no-deps --workspace --exclude oqci-python
        env:
          RUSTDOCFLAGS: -D warnings

  python:
    name: python (ubuntu-latest)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Show toolchain
        run: rustup show

      - name: Cache
        uses: Swatinem/rust-cache@v2

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build the extension and run the Python tests
        run: |
          python -m venv .venv
          source .venv/bin/activate
          pip install -r python/requirements-dev.txt
          maturin develop --manifest-path python/Cargo.toml
          pytest python/tests -q

  # External validation of every QIR module OQCI emits
  # (final-deliverables-spec.md §14.3). tests/qir_conformance.rs checks the
  # Base Profile structure itself and writes the corpus; these jobs hand the
  # same files to tools OQCI did not write. What each proves is stated in
  # docs/qir_lowering.md §4.
  qir-validate:
    name: qir (PyQIR 0.12.5, llvm-as 18)
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Show toolchain
        run: rustup show

      - name: Cache
        uses: Swatinem/rust-cache@v2

      - name: Write the QIR corpus
        run: cargo test --test qir_conformance
        env:
          OQCI_QIR_CORPUS_DIR: ${{ github.workspace }}/qir-corpus

      - name: Install LLVM 18
        run: |
          sudo apt-get update
          sudo apt-get install -y llvm-18
          llvm-as-18 --version

      - name: llvm-as 18 (opaque and typed)
        run: |
          set -euo pipefail
          for module in qir-corpus/opaque/*.ll qir-corpus/typed/*.ll; do
            llvm-as-18 "$module" -o /dev/null
            echo "ok  $module"
          done

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: PyQIR 0.12.5 (opaque and typed)
        run: |
          pip install -r python/requirements-qir.txt
          python scripts/validate_qir.py qir-corpus/opaque
          python scripts/validate_qir.py qir-corpus/typed

  qir-typed-llvm14:
    name: qir (typed pointers, llvm-as 14)
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Show toolchain
        run: rustup show

      - name: Cache
        uses: Swatinem/rust-cache@v2

      - name: Write the QIR corpus
        run: cargo test --test qir_conformance
        env:
          OQCI_QIR_CORPUS_DIR: ${{ github.workspace }}/qir-corpus

      - name: Install LLVM 14
        run: |
          sudo apt-get update
          sudo apt-get install -y llvm-14
          llvm-as-14 --version

      # LLVM 14 defaults to typed pointers, the spelling of the QIR 1.0
      # specification's own examples, so only the typed corpus is given to it.
      - name: llvm-as 14 (typed)
        run: |
          set -euo pipefail
          for module in qir-corpus/typed/*.ll; do
            llvm-as-14 "$module" -o /dev/null
            echo "ok  $module"
          done

  # Dependency hygiene (final-deliverables-spec.md §29): known
  # vulnerabilities, licences, bans and sources, per deny.toml.
  deny:
    name: cargo-deny
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # --workspace: the root is also a package, and without it cargo-deny
      # checks only that package — which is how a pyo3 advisory in the python/
      # member reached CI through cargo-audit alone.
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check advisories licenses bans sources
          arguments: --workspace

  audit:
    name: cargo-audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit
      - name: Audit Cargo.lock
        run: cargo audit

  # Parser and pipeline fuzzing (§23.3). Each target runs for a bounded time
  # from the committed seed corpus; any crash, and any miscompilation found
  # by compile_verified, fails the job. Linux only: libFuzzer needs nightly
  # and sanitizers.
  fuzz:
    name: fuzz (nightly, ${{ matrix.target }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target: [openqasm, cudaq, target_json, qiskit_handoff, compile_verified]
    steps:
      - uses: actions/checkout@v4
      - name: Nightly toolchain
        run: rustup toolchain install nightly --profile minimal
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-fuzz
      - name: Seed corpus regression (any toolchain)
        working-directory: fuzz
        run: cargo test --no-default-features
      - name: Mutation smoke (stable, no libFuzzer)
        working-directory: fuzz
        env:
          OQCI_MUTATION_ONLY: ${{ matrix.target }}
        run: bash ../scripts/ci_annotate.sh "mutation smoke ${{ matrix.target }}" cargo test --no-default-features --release --test mutate -- --ignored --nocapture
      - name: Fuzz for 60 seconds
        # --target: the prebuilt cargo-fuzz is a static musl binary and
        # defaults to its own triple, for which no std is installed and which
        # AddressSanitizer cannot instrument.
        run: |
          mkdir -p fuzz/corpus/${{ matrix.target }}
          bash scripts/ci_annotate.sh "cargo fuzz ${{ matrix.target }}" cargo +nightly fuzz run --fuzz-dir fuzz --target x86_64-unknown-linux-gnu ${{ matrix.target }} fuzz/corpus/${{ matrix.target }} -- -max_total_time=60
      - name: Keep crashing inputs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-artifacts-${{ matrix.target }}
          path: fuzz/artifacts

  # The CUDA-Q execution adapter against a real, pinned CUDA-Q (CPU target):
  # counts must agree with the exact distribution and with Aer.
  cudaq:
    name: cudaq (0.16.0.post1)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install CUDA-Q and build OQCI
        run: |
          python -m venv .venv
          source .venv/bin/activate
          bash scripts/ci_annotate.sh "pip install cudaq" pip install -r python/requirements-dev.txt cudaq==0.16.0.post1
          bash scripts/ci_annotate.sh "maturin develop" maturin develop --manifest-path python/Cargo.toml
      - name: CUDA-Q imports and runs on the CPU target
        run: |
          source .venv/bin/activate
          bash scripts/ci_annotate.sh "import cudaq" python -c "import cudaq; print(cudaq.__version__); print(cudaq.get_target())"
      - name: Run the CUDA-Q adapter tests against CUDA-Q
        env:
          # A missing or broken CUDA-Q fails this job instead of skipping it.
          OQCI_REQUIRE_CUDAQ: "1"
          # Aer and CUDA-Q each bundle a libgomp; glibc's default 512-byte
          # static TLS reserve fits only the first one loaded (docs/adapters.md).
          GLIBC_TUNABLES: glibc.rtld.optional_static_tls=16384
        run: |
          source .venv/bin/activate
          bash scripts/ci_annotate.sh "cudaq tests" pytest python/tests/test_backend_cudaq.py python/tests/test_backend_cudaq_live.py -v -rs

  # The benchmark harness end to end on the smoke profile (never reported as
  # results), plus its own tests.
  benchmarks-smoke:
    name: benchmarks (smoke)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install LLVM 18
        run: |
          sudo apt-get update
          sudo apt-get install -y llvm-18
      - name: Smoke run, report and harness tests
        run: |
          python -m venv .venv
          source .venv/bin/activate
          pip install -r python/requirements-dev.txt -r benchmarks/requirements.txt
          maturin develop --release --manifest-path python/Cargo.toml
          cd benchmarks
          pytest tests -q
          python -m oqci_bench run --config configs/smoke.toml --out results/ci
          python -m oqci_bench interop --config configs/smoke.toml --out results/ci
          python -m oqci_bench coverage --config configs/smoke.toml --out results/ci
          python -m oqci_bench report results/ci
      - uses: actions/upload-artifact@v4
        with:
          name: benchmark-smoke-report
          path: benchmarks/results/ci/report

  # The Stage G determinism protocol (§3.2): the full corpus, ten
  # repetitions each in a fresh process, on every claimed platform.
  determinism:
    name: determinism (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Ten fresh-process compilations of the Stage G corpus
        shell: bash
        run: |
          python -m venv .venv
          source .venv/bin/activate 2>/dev/null || source .venv/Scripts/activate
          pip install -r python/requirements-dev.txt -r benchmarks/requirements.txt
          maturin develop --release --manifest-path python/Cargo.toml
          cd benchmarks
          python -m oqci_bench determinism --config configs/stage_g.toml --out results/determinism
          python -c "import json,sys; d=json.load(open('results/determinism/determinism.json')); print(d['passed'],'/',d['items']); sys.exit(d['passed']!=d['items'])"
      - uses: actions/upload-artifact@v4
        with:
          name: determinism-${{ matrix.os }}
          path: benchmarks/results/determinism/determinism.json

  # Python wheels, as build artifacts only — nothing is published.
  wheels:
    name: wheel (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build
        run: |
          pip install "maturin>=1.7,<2.0"
          maturin build --release --manifest-path python/Cargo.toml --out dist
      - uses: actions/upload-artifact@v4
        with:
          name: wheel-${{ matrix.os }}
          path: dist/*.whl

  docker:
    name: docker build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build the reproducible environment
        run: docker build -t oqci --build-arg OQCI_GIT_COMMIT=${{ github.sha }} .
      - name: Smoke-test the image
        run: |
          docker run --rm oqci oqci compile examples/bell.qasm --emit qc-ir
          docker run --rm oqci python -c "import oqci; print(oqci.__version__)"
