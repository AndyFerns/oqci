# The checker coverage matrix (Stage G §3.1), as data.
#
# For every transformation the compiler performs, the checkers that cover it
# and their kind:
#
#   structural            I1-I8 re-validation, target legality
#   semantic-test         an independent semantic model, in tests only
#   semantic-in-compiler  crate::verify, running during compilation (--verify)
#   external              a third-party tool at a pinned version
#
# Every `ref` is `path::function`, and `python -m oqci_bench coverage`
# fails if the function does not exist in that file — the matrix cannot cite
# a check that is not there. It is reported as-is, never collapsed into a
# score.

[[transformation]]
id = "binding"
stage = "parameters"
checkers = [
  { kind = "structural", ref = "src/ir/bind.rs::bind_parameters", note = "re-validates through CircuitBuilder" },
  { kind = "semantic-test", ref = "src/ir/bind.rs::binding_matches_a_directly_built_concrete_circuit" },
  { kind = "semantic-in-compiler", ref = "src/verify/mod.rs::check_binding", note = "exact substitution" },
]

