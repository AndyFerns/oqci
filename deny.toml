# Dependency policy (final-deliverables-spec.md §29): advisories, licences,
# bans and sources, checked by `cargo deny check` in CI.

[graph]
all-features = false

[advisories]
# Known vulnerabilities and unmaintained crates fail the check; a yanked
# version is a warning (it may still be the newest compatible release).
yanked = "warn"
ignore = []

[licenses]
# Permissive licences compatible with OQCI's Apache-2.0, as SPDX ids. A
# dependency under anything else fails the check until it is reviewed and
# added here deliberately.
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "MIT",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "CC0-1.0",
    "MPL-2.0",
    "BSL-1.0",
]
confidence-threshold = 0.9

[bans]
multiple-versions = "warn"
wildcards = "deny"
# Path dependencies inside this workspace (examples, fuzz) carry no version.
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
